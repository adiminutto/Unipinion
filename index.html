<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unipinion — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="page">
    <div class="search-hero">
      <h1>What's the Unipinion?</h1>
      <div class="search-bar-wrap">
        <input type="search" id="search-input" placeholder="Search food, events, clubs, classes…" autocomplete="off" />
        <span class="search-icon">🔍</span>
      </div>
    </div>

    <div class="dash-grid">
      <aside class="panel">
        <h2>Recommended</h2>
        <div class="side-list" id="recommended-list"></div>
      </aside>

      <div class="filter-col" id="category-filters"></div>

      <section class="panel">
        <h2>Results</h2>
        <div class="subfilter-row" id="subcategory-filters"></div>
        <div class="results-list" id="results-list"></div>
      </section>

      <aside class="panel">
        <h2>New / Trending</h2>
        <div class="side-list" id="trending-list"></div>
      </aside>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
